[project]
name = "disttask"
version = "0.1.0"
description = "Distributed task queue framework built in Python with Redis, PostgreSQL, worker orchestration, retries, scheduling, and monitoring."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "msgpack>=1.1.2",
    "pydantic-settings>=2.14.1",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
