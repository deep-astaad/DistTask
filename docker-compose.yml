services:

  redis:
    image: redis:7-alpine
    container_name: disttask_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - disttask_network

  postgres:
    image: postgres:16
    container_name: disttask_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - disttask_network

volumes:
  redis_data:
  postgres_data:

networks:
  disttask_network:
    driver: bridge